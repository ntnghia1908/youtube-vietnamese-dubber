# Cấu hình mẫu cho YouTube Vietnamese Dubber.
# Copy thành `config.yaml` (đã gitignore) rồi sửa theo máy của bạn.
# Mọi key đều tùy chọn trừ `translation.model`. Flag CLI ghi đè giá trị ở đây.

workspace: ./output

target_language: vi

whisper:
  model: medium          # tiny/base/small/medium/large-v3
  device: auto           # auto/cpu/cuda
  compute_type: auto

translation:
  provider: ollama
  model: gemma3:12b      # bắt buộc — không có mặc định trong code (CP6.5: qwen3:8b trượt xưng hô ba–con)
  # host: http://localhost:11434   # bỏ trống -> biến môi trường OLLAMA_HOST -> localhost
  batch_size: 25         # số segment mỗi lần gọi model (plan khuyến nghị 20–30)
  context_size: 5        # số dòng đã dịch trước đó gửi kèm làm ngữ cảnh
  max_attempts: 3        # số lần thử mỗi batch trước khi chia đôi batch
  temperature: 0.3       # > 0 để lần thử lại ra output khác
  num_ctx: 8192          # context window của Ollama; nhỏ quá thì prompt bị cắt im lặng
  timeout_seconds: 900   # gemma3:12b: một batch 25 câu ~110–175s (GPU 6 GB / CPU thuần)
  think: false           # tắt chế độ suy nghĩ của qwen3; để null nếu model không hỗ trợ
  # glossary: ./glossary.yaml   # glossary dùng chung (vd cả series), gộp với <episode>/glossary.yaml
  glossary_max_chars: 8000      # ký tự transcript tối đa gửi model khi tạo nháp (video zh/ja: giảm ~ một nửa)

tts:
  provider: edge                # hiện chỉ có edge (edge-tts, miễn phí, không cần API key)
  voice: vi-VN-HoaiMyNeural     # xem toàn bộ voice: `edge-tts --list-voices`
  rate: "+0%"                   # tốc độ đọc, dạng +N% / -N% (bắt buộc có dấu %)
  volume: "+0%"                 # âm lượng, cùng định dạng
  concurrency: 4                # số segment tổng hợp song song
  max_attempts: 3               # số lần thử mỗi segment trước khi đánh dấu lỗi
  timeout_seconds: 60           # timeout nhận audio cho mỗi segment

timing:
  normal_max_ratio: 1.05  # tts_duration/slot <= giá trị này: giữ nguyên tốc độ
  max_tempo: 1.25          # co giãn (ffmpeg atempo) tối đa; vượt quá -> too_long

mixing:
  original_volume: 0.30    # volume audio gốc khi mix (0.0–1.0); 0 = tắt hẳn audio gốc
  speech_volume: 1.00      # volume giọng tiếng Việt (> 0, <= 2.0)
  max_shift_seconds: 1.0   # dời tối đa một câu khi câu trước tràn slot; 0 = không dời (đè)

pipeline:
  repair_rounds: 2   # `dub`: số vòng tối đa chạy lại translate (câu dịch lỗi) và tts+normalize (thiếu audio); 0 = không thử lại
  max_consecutive_failures: 3   # `playlist`: dừng sau N tập lỗi liên tiếp (lỗi hệ thống: Ollama tắt, hết mạng...); 0 = không dừng
