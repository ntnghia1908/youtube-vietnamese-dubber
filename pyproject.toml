[project]
name = "youtube-vietnamese-dubber"
version = "0.1.0"
description = "Công cụ local tạo bản thuyết minh tiếng Việt cho video/playlist YouTube."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "yt-dlp>=2024.12.0",
    "faster-whisper>=1.0.0",
    # faster-whisper 1.2.1 gọi av.open(..., metadata_errors=...) mà av 17+ đã bỏ
    # -> stage transcribe lỗi trên máy cài mới. Bỏ ghim khi faster-whisper hỗ trợ av mới.
    "av>=14,<17",
    "pyyaml>=6.0",
    "edge-tts>=7.0",
]

[project.optional-dependencies]
# Web UI local (`python -m app web`) — tùy chọn, các lệnh CLI khác không cần.
# httpx cho fastapi TestClient trong test.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
# Template/static dưới app/web được hatch gồm sẵn (packages = ["app"] lấy mọi
# file trong package, không chỉ .py) — không khai thêm `include` kẻo vô tình lọc mất.
