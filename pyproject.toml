[project]
name = "youtube-vietnamese-dubber"
version = "0.1.0"
description = "Công cụ local tạo bản thuyết minh tiếng Việt cho video/playlist YouTube."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "yt-dlp>=2024.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
